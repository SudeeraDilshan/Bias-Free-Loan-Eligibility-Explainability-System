version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: loan-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - DATABASE_URL=sqlite:///./app.db
    volumes:
      - ./ml:/app/ml
      - ./backend/app:/app/app
      - ./backend/logs:/app/logs
      - ./backend/results:/app/results
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - loan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: loan-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - loan-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL Database (if needed)
  # db:
  #   image: postgres:15-alpine
  #   container_name: loan-db
  #   environment:
  #     - POSTGRES_USER=loanuser
  #     - POSTGRES_PASSWORD=secure_password
  #     - POSTGRES_DB=loandb
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - loan-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U loanuser"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  loan-network:
    driver: bridge

volumes:
  postgres_data:
